<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#00A86B">

  <title>Admin - Shae Cleaners</title>

  <link rel="stylesheet" href="admin.css">
</head>

<body>

  <header class="admin-header">
    <div>
      <h2>Shae Cleaners</h2>
      <span>Panel Admin</span>
    </div>

    <button id="logoutBtn" class="logout-btn">
      Keluar
    </button>
  </header>


  <main class="container">

    <!-- STATISTIK -->

    <section class="stats">

      <div class="stat-card">
        <div class="stat-icon">🔔</div>
        <div>
          <small>Pesanan Baru</small>
          <strong id="jumlahBaru">0</strong>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon">🧹</div>
        <div>
          <small>Diproses</small>
          <strong id="jumlahProses">0</strong>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon">✅</div>
        <div>
          <small>Selesai</small>
          <strong id="jumlahSelesai">0</strong>
        </div>
      </div>

    </section>


    <!-- FILTER -->

    <section class="filter-box">

      <button class="filter active" data-status="semua">
        Semua
      </button>

      <button class="filter" data-status="Menunggu">
        Baru
      </button>

      <button class="filter" data-status="Diproses">
        Diproses
      </button>

      <button class="filter" data-status="Selesai">
        Selesai
      </button>

      <button class="filter" data-status="Dibatalkan">
        Batal
      </button>

    </section>


    <!-- PESANAN -->

    <section>

      <div class="section-title">
        <h3>Pesanan Masuk</h3>

        <span id="indikator">
          ● Realtime
        </span>
      </div>

      <div id="orderList">

        <div class="loading">
          Memuat pesanan...
        </div>

      </div>

    </section>

  </main>


  <!-- MODAL DETAIL -->

  <div id="detailModal" class="modal">

    <div class="modal-box">

      <button class="close-modal" id="closeModal">
        ×
      </button>

      <h3>Detail Pesanan</h3>

      <div id="detailOrder"></div>

    </div>

  </div>


  <script type="module" src="admin.js"></script>

</body>
</html>
