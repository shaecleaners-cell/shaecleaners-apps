<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#16a34a">
<title>Admin - Shae Cleaners</title>
<link rel="stylesheet" href="admin.css">
</head>

<body>

<div class="app">

  <!-- PASSWORD ADMIN -->
  <div id="loginBox" class="card">

    <div class="logo">SC</div>

    <h1>Admin Shae Cleaners</h1>

    <p>
      Masukkan password untuk membuka dashboard.
    </p>

    <input
      id="adminPassword"
      type="password"
      placeholder="Password Admin"
      autocomplete="off"
    >

    <button id="loginBtn">
      Masuk Dashboard
    </button>

    <div id="loginMsg" class="msg"></div>

  </div>


  <!-- DASHBOARD -->
  <main id="panel" hidden>

    <header>

      <div>
        <h1>
          Shae <span>Cleaners</span>
        </h1>

        <p>
          Panel Admin • Order Cleaning
        </p>
      </div>

      <button id="logoutBtn" class="logout">
        Keluar
      </button>

    </header>


    <div id="errorBox" class="error" hidden></div>


    <section class="stats">

      <div>
        <b id="totalOrders">0</b>
        <span>Total Order</span>
      </div>

      <div>
        <b id="waitingOrders">0</b>
        <span>Menunggu</span>
      </div>

      <div>
        <b id="confirmedOrders">0</b>
        <span>Dikonfirmasi</span>
      </div>

      <div>
        <b id="doneOrders">0</b>
        <span>Selesai</span>
      </div>

    </section>


    <div class="toolbar">

      <h2>
        Pesanan Terbaru
      </h2>

      <select id="filterStatus">

        <option value="">
          Semua Status
        </option>

        <option>
          Menunggu
        </option>

        <option>
          Menunggu Konfirmasi
        </option>

        <option>
          Dikonfirmasi
        </option>

        <option>
          Diproses
        </option>

        <option>
          Selesai
        </option>

      </select>

    </div>


    <div id="orders">

      <div class="loading">
        Menghubungkan ke Firebase...
      </div>

    </div>

  </main>

</div>


<script type="module" src="admin.js"></script>

</body>
</html>
